# JVM / daemon configuration tuned for a small (2 CPU / 3.8 GB RAM) build box.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1408m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
# Offline build box: fixed local JDK (Temurin 21 from jdk4py)
org.gradle.java.home=/home/user/.local/lib/python3.11/site-packages/jdk4py/java-runtime
# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Toolchain probe path (stripped runtime + javac shim, see README)
org.gradle.java.installations.paths=/home/user/tools/fakejdk
org.gradle.java.installations.auto-detect=true
